name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          python3 --version

      - name: Byte-compile the runner
        run: python3 -m py_compile bin/claudecron

      - name: Lint (pyflakes, best-effort)
        run: |
          python3 -m pip install --quiet pyflakes || true
          python3 -m pyflakes bin/claudecron || true

      - name: Regression tests
        run: bash scripts/regression-test.sh

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Privacy scrub
        run: bash scripts/scrub-check.sh .
